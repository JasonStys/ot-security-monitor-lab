name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Passive OT + evidence / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    env:
      PYTHONPATH: .
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Source Tk shared library on disposable Linux workers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libtk8.6
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=otmon --cov-report=term-missing:skip-covered
      - run: python scripts/code_map.py --check
      - run: python scripts/file_guide.py --check
      - run: python scripts/validate_repo.py
      - run: python scripts/evaluate.py
      - run: python scripts/benchmark.py
  native:
    name: Independent offline TShark golden vectors
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Verify and extract the official offline dissector on this disposable worker
        timeout-minutes: 5
        run: python scripts/tshark_runner.py
      - run: python scripts/native.py
  security:
    name: Locked graph + secrets + workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
      - run: python scripts/scanners.py gitleaks
      - run: python scripts/scanners.py actionlint
      - run: .tools/gitleaks git . --redact --no-banner
      - run: .tools/actionlint
  portable-windows:
    name: Windows / actual offline native workbench
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-native.lock --disable-pip --no-deps
      - name: Build complete patched Python and actual runtime notices
        run: python scripts/build_native.py
      - name: Real Tk/core inputs, independent oracles, export and two-process reopen
        run: python scripts/test_native_app.py
