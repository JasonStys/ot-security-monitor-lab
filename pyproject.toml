# Jason Stys: zero-dependency passive runtime, strict types and combined statement/branch coverage.
[project]
name = "ot-security-monitor-lab"
version = "1.0.0"
description = "Passive offline OT protocol and anomaly assurance by Jason Stys"
requires-python = ">=3.12"
dependencies = []
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
strict = true
python_version = "3.12"
files = ["otmon"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["otmon"]
[tool.coverage.report]
fail_under = 95
show_missing = true
